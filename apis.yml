name: Intella, LTD
description: >-
  Intella is an enterprise Arabic AI company founded in 2021, building proprietary Arabic speech
  intelligence from the ground up for banks, telecoms, and governments across the MENA region.
  Its product suite includes Ziila (an AI voice agent handling inbound/outbound conversations across
  25+ Arabic dialects), intellaCX (call-center conversation analytics for sentiment and friction
  detection), intellaMX (media translation and dialect-aware subtitling), and intellaVX (a dialectal
  Arabic speech-to-text engine exposed through a REST API for high-throughput CCaaS, CRM, and
  developer-tool integration). Backed by 500 Global.
